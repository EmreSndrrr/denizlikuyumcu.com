# Fiyat anlık görüntüsü — BİRİNCİL zamanlanmış tetikleyici.
#
# Neden Vercel Cron değil: Hobby planı cron'u GÜNDE BİR KEZLE sınırlıyor
# ("Hobby accounts are limited to daily cron jobs" — deploy denemesinde
# doğrulandı). vercel.json'daki günlük cron yalnızca YEDEK olarak duruyor;
# asıl toplama burada, 15 dakikada bir yapılıyor (Truncgil kendi verisini
# ~15 dk'da bir güncelliyor, bu yüzden doğal ritim bu). Repo public
# olduğu için GitHub Actions dakikaları ücretsiz.
#
# Kurulum (GitHub repo → Settings → Secrets and variables → Actions):
#   Secret:   CRON_SECRET   — Vercel'deki CRON_SECRET ile AYNI değer
#                             (yerelde .env.local dosyasından kopyalanabilir)
#   Variable: SNAPSHOT_URL  — https://denizlikuyumcu.com/api/cron/snapshot
#
# Endpoint kendi içinde Truncgil Update_Date'ini kontrol eder; değişmemişse
# yeni kayıt oluşturmaz ("skipped" döner), bu yüzden fazladan tetiklenme
# zararsızdır.
#
# NOT: GitHub'ın zamanlanmış workflow'ları yoğun saatlerde gecikebilir ve
# repo 60 gün hareketsiz kalırsa devre dışı bırakılır — vercel.json'daki
# günlük cron tam da bu duruma karşı bir emniyet ağı.

name: price-snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger snapshot endpoint
        env:
          SNAPSHOT_URL: ${{ vars.SNAPSHOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SNAPSHOT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SNAPSHOT_URL (variable) veya CRON_SECRET (secret) tanımlı değil." >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/snap.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SNAPSHOT_URL")
          echo "HTTP $code"
          cat /tmp/snap.json
          echo
          case "$code" in
            2*) exit 0 ;;
            *)  exit 1 ;;
          esac
