# Fiyat anlık görüntüsü — YEDEK tetikleyici.
#
# BİRİNCİL yol artık Vercel Cron (bkz. vercel.json): Vercel, cron
# çağrısında CRON_SECRET'i otomatik olarak "Authorization: Bearer …"
# başlığıyla gönderiyor, bu yüzden ek bir sır paylaşımı gerekmiyor.
#
# Bu workflow yalnızca ELLE (workflow_dispatch) çalışacak şekilde
# bırakıldı — Vercel Cron'un yetmediği veya planın izin vermediği bir
# durumda `schedule` satırını geri açıp şu ikisini tanımlamak yeterli:
#   Secret:   CRON_SECRET   — sitedeki CRON_SECRET ile AYNI değer
#   Variable: SNAPSHOT_URL  — https://denizlikuyumcu.com/api/cron/snapshot
#
# Endpoint kendi içinde Truncgil Update_Date'ini kontrol eder; değişmemişse
# yeni kayıt oluşturmaz ("skipped" döner), bu yüzden fazladan tetiklenme
# zararsızdır.

name: price-snapshot

on:
  workflow_dispatch: {}

concurrency:
  group: price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger snapshot endpoint
        env:
          SNAPSHOT_URL: ${{ vars.SNAPSHOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SNAPSHOT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SNAPSHOT_URL (variable) veya CRON_SECRET (secret) tanımlı değil." >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/snap.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SNAPSHOT_URL")
          echo "HTTP $code"
          cat /tmp/snap.json
          echo
          case "$code" in
            2*) exit 0 ;;
            *)  exit 1 ;;
          esac
